spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

app.order.shipping-fee=${APP_ORDER_SHIPPING_FEE:10.00}

# Chave HS256 para assinar os JWT (minimo de 32 caracteres); troque em producao
app.jwt.secret=${APP_JWT_SECRET:dev-store-app-jwt-secret-troque-em-producao}
app.jwt.expiration=${APP_JWT_EXPIRATION:2h}
